[package]
name = "nexssh"
description = "NexSSH — a fast, minimal SSH client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "nexssh"

[lib]
name = "nexssh_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
nexssh-core.workspace = true
tauri = { version = "2.12", features = [] }
# In-app updates from GitHub Releases; rustls on ring (already used by russh), no zip formats.
tauri-plugin-updater = { version = "2.13", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
zeroize = "1"
tauri-plugin-dialog = "2.7"
tauri-plugin-single-instance = "2"
# AI agents (agents/): MCP over HTTP on localhost, and the stdio bridge that talks to it.
# hyper and its helpers are already part of the updater's dependency tree.
tokio = { workspace = true, features = ["rt", "net", "io-util", "io-std", "macros", "time", "sync"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
# "Open with NexSSH" in Explorer's context menu for folders (explorer.rs); in Windows 11's
# compact menu through a package (explorer/).
nexssh-explorer = { path = "../explorer" }
winreg = "0.55"
# Links from the terminal open in the default browser (links.rs); the installer's window and
# the user's languages for the Explorer menu entry (explorer.rs).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The paths of files dropped on the page (sftp.rs); the version Tauri's WebView2 uses.
webview2-com = "0.39"
