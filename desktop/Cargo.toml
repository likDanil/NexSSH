[package]
name = "nexssh"
description = "NexSSH — a fast, minimal SSH client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "nexssh"

[lib]
name = "nexssh_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
nexssh-core.workspace = true
tauri = { version = "2.12", features = [] }
# In-app updates from GitHub Releases; rustls on ring (already used by russh), no zip formats.
tauri-plugin-updater = { version = "2.13", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
zeroize = "1"
tauri-plugin-dialog = "2.7"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# "Open with NexSSH" in Explorer's context menu for folders (explorer.rs); in Windows 11's
# compact menu through a package (explorer/).
nexssh-explorer = { path = "../explorer" }
winreg = "0.55"
# Links from the terminal open in the default browser (links.rs).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
