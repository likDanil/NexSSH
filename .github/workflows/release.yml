name: Release

# Publishes a GitHub release with the Windows installer (.exe, NSIS).
#
#   * push a tag:   git tag v0.2.0 && git push origin v0.2.0
#   * or run this workflow from the Actions tab: enter a version, or leave it
#     empty for the version in Cargo.toml when that is newer than the latest
#     release (raised there for a minor or major release), else the next patch
#     version. "Dry run" only builds the installer and attaches it to the
#     workflow run.
#
# Branch pushes that change the release setup (this file, the bundle config, the
# icons, the installer hooks or the Explorer menu's package) run as a dry run, so a
# broken installer build shows up before a release does.
#
# The version from the tag/input is written into Cargo.toml for the build, so the
# app, the installer name and the release always agree.
#
# In-app updates: the TAURI_SIGNING_PRIVATE_KEY (and _PASSWORD) secrets sign the
# installer, and the release gets a latest.json that installed apps read from
# https://github.com/<repo>/releases/latest/download/latest.json. The matching public key
# is in desktop/tauri.conf.json (plugins.updater.pubkey). A release without them would be
# invisible to installed apps, so publishing stops right away when the key is missing;
# dry runs still build (unsigned).

on:
  push:
    tags: ['v*.*.*']
    # Dry run on branches (path filters do not apply to tags).
    branches: ['**']
    paths:
      - .github/workflows/release.yml
      - desktop/tauri.conf.json
      - desktop/icons/**
      - desktop/windows/**
      - explorer/**
      - scripts/explorer-package.ps1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0 (empty = the one in Cargo.toml if newer than the latest release, else the next patch)'
        required: false
        type: string
      dry_run:
        description: 'Dry run: build the installer without publishing a release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Publishing runs are queued one at a time; branch dry runs replace each other.
  group: ${{ github.ref_type == 'branch' && github.event_name == 'push' && format('release-check-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: resolve
        name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            is_tag=true
          else
            is_tag=false
          fi
          if $is_tag; then
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${DRY_RUN:-false}" != "true" ]]; then
            publish=true
          else
            publish=false
          fi

          if $is_tag; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            version="${INPUT_VERSION#v}"
          else
            current="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
            latest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)"
            latest="${latest#v}"
            if [[ -z "$latest" ]]; then
              # First release.
              version="$current"
            elif [[ "$current" != "$latest" && "$(printf '%s\n' "$latest" "$current" | sort -V | tail -n1)" == "$current" ]]; then
              # Cargo.toml was raised for this release (a new minor or major version).
              version="$current"
            else
              IFS=. read -r major minor patch <<< "$latest"
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          # Windows installers need a plain numeric version.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3"
            exit 1
          fi
          if $publish && ! $is_tag && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          if $publish && [[ "$HAS_SIGNING_KEY" != "true" ]]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set, so installed apps could not update to this release. Add it and TAURI_SIGNING_PRIVATE_KEY_PASSWORD under Settings > Secrets and variables > Actions > Secrets, then run the release again."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if $publish; then
            echo "Releasing NexSSH $version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run: building the NexSSH $version installer without publishing" >> "$GITHUB_STEP_SUMMARY"
          fi

  windows:
    name: Build Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          sed -i '0,/^version = ".*"/s//version = "${{ needs.version.outputs.version }}"/' Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # "Open with NexSSH" in Windows 11's compact context menu: a package signed with a
      # certificate made for this build only (see the script).
      - name: Package the Explorer menu entry
        shell: pwsh
        run: ./scripts/explorer-package.ps1

      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Embedded by desktop/build.rs.
          NEXSSH_EXPLORER_PACKAGE: ${{ github.workspace }}\target\explorer-package
        run: |
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            # Also writes <installer>.sig for in-app updates.
            npm run tauri build -- --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            # Only dry runs get here: publishing needs the key (see "Resolve version").
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without the update signature"
            npm run tauri build -- --bundles nsis
          fi

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/bundle/nsis/*-setup.exe dist/
          cp target/release/bundle/nsis/*-setup.exe.sig dist/ 2>/dev/null || true
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NexSSH-${{ needs.version.outputs.version }}-windows-x64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, windows]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NexSSH-${{ needs.version.outputs.version }}-windows-x64
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NexSSH $TAG" \
            --generate-notes

      - name: Publish the in-app update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          exe="$(ls dist/*-setup.exe)"
          if [[ ! -f "$exe.sig" ]]; then
            echo "::error::The installer was not signed, so there is no latest.json: installed apps will not see this release"
            exit 1
          fi
          name="$(basename "$exe")"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name"
          notes="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$notes" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$exe.sig")" \
            --arg url "$url" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
                "windows-x86_64": {signature: $signature, url: $url},
                "windows-x86_64-nsis": {signature: $signature, url: $url}
              }}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY"
