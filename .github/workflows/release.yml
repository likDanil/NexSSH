name: Release

# Publishes a GitHub release with the Windows installer (.exe, NSIS).
#
#   * push a tag:   git tag v0.2.0 && git push origin v0.2.0
#   * or run this workflow from the Actions tab: enter a version, or leave it
#     empty to bump the patch number of the latest release. "Dry run" only builds
#     the installer and attaches it to the workflow run.
#
# The version from the tag/input is written into Cargo.toml for the build, so the
# app, the installer name and the release always agree.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0 (empty = next patch version)'
        required: false
        type: string
      dry_run:
        description: 'Dry run: build the installer without publishing a release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: resolve
        name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            version="${INPUT_VERSION#v}"
          else
            latest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)"
            if [[ -z "$latest" ]]; then
              # First release: use the version already in Cargo.toml.
              version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          # Windows installers need a plain numeric version.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "push" ]] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing NexSSH $version" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Build Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          sed -i '0,/^version = ".*"/s//version = "${{ needs.version.outputs.version }}"/' Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run tauri build -- --bundles nsis

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/bundle/nsis/*-setup.exe dist/
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NexSSH-${{ needs.version.outputs.version }}-windows-x64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, windows]
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NexSSH-${{ needs.version.outputs.version }}-windows-x64
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NexSSH $TAG" \
            --generate-notes
