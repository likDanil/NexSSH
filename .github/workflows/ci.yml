name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Lint and test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev openssh-server

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check the UI
        run: npm run check

      - name: Build the UI
        run: npm run ui:build

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Start test SSH servers
        run: sudo -E scripts/test-sshd.sh | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Tests (unit + integration against sshd)
        run: cargo test --workspace

  windows:
    name: Check (Windows)
    runs-on: windows-latest
    env:
      # The package of the Explorer menu entry, which desktop/build.rs embeds.
      NEXSSH_EXPLORER_PACKAGE: ${{ github.workspace }}\target\explorer-package
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the UI
        run: npm run ui:build

      - name: Package the Explorer menu entry
        run: ./scripts/explorer-package.ps1

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test -p nexssh-core --lib

      # Registers the package for the runner's user (without administrator rights) and asks its
      # COM server for the entry.
      - name: Explorer menu entry
        run: cargo test --no-fail-fast -p nexssh-explorer -p nexssh-explorer-command
