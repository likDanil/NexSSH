[workspace]
resolver = "3"
members = ["core", "desktop", "explorer", "explorer/command"]

[workspace.package]
version = "1.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["NexSSH contributors"]
repository = "https://github.com/likDanil/NexSSH"

[workspace.dependencies]
nexssh-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false }
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Crypto and key parsing are painfully slow without optimizations;
# keep our own crates debuggable but optimize dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 2
