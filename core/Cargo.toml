[package]
name = "nexssh-core"
description = "NexSSH core: SSH sessions, authentication, known hosts, port forwarding, server storage and ssh_config import. Has no GUI dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
# SFTP client over an existing SSH channel (same author as russh).
russh-sftp = "3"
# Many SFTP requests in flight at once (already part of russh's dependency tree).
futures-util = "0.3"
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros", "io-util", "fs"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror = "2"
dirs = "7"
getrandom = "0.4"
zeroize = "1"
# Hashed known_hosts entries (HMAC-SHA1); already part of russh's dependency tree.
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
# OS credential storage (Keychain / Credential Manager / Secret Service).
keyring-core = "1"
# Pseudo-terminals for local shells (ConPTY on Windows); WezTerm's, widely used.
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
# Finding shells: WSL distributions and Git for Windows are registered in the registry.
winreg = "0.55"

[target.'cfg(unix)'.dependencies]
# SIGKILL for a program in a local terminal that ignores the hang-up signal.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
